<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>¿Qué masaje necesitás?</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400,500,600,700,800&display=swap" rel="stylesheet"/>
<style>
:root{
  /* Paleta NUHA */
  --nuha-beige-warm: #D8C2AE;
  --nuha-sand-soft: #CBB6A1;
  --nuha-cream-light: #F5EDE3;
  --nuha-taupe-brown: #7A6A5A;
  --nuha-dark-brown-text: #3A312A;
  --nuha-gold-elegant: #C9A35A;
  --nuha-gold-bright: #F0C878;
  --nuha-gold-deep: #A97C2F;
  --nuha-rose: #C98B7A;
  --nuha-sage: #6E8F72;
  --nuha-error: #C1685E;

  --surface: #FFFDF9;
  --surface-2: #F3E9DC;
  --line: rgba(122,106,90,0.22);
  --shadow: 0 14px 34px rgba(58,49,42,0.16);
  --shadow-strong: 0 18px 40px rgba(58,49,42,0.26);
  --text: var(--nuha-dark-brown-text);
  --text-dim: rgba(58,49,42,0.62);
  --gold: var(--nuha-gold-elegant);
}
*{ box-sizing:border-box; }
body{
  margin:0;
  font-family:'Manrope', sans-serif;
  background: linear-gradient(150deg, var(--nuha-cream-light) 0%, var(--nuha-sand-soft) 55%, var(--nuha-beige-warm) 100%);
  color: var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.card{
  width:100%;
  max-width:480px;
  background: var(--surface);
  border-radius:28px;
  box-shadow: var(--shadow-strong);
  padding:34px 28px 28px;
  position:relative;
  overflow:hidden;
}
.card::before{
  content:'';
  position:absolute; top:0; left:0; right:0; height:8px;
  background: linear-gradient(90deg, var(--nuha-gold-bright), var(--nuha-gold-elegant) 55%, var(--nuha-gold-deep));
}
h1{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:24px;
  margin:6px 0 4px;
  line-height:1.25;
  text-align:center;
}
h1 em{ font-style:italic; color: var(--nuha-rose); }
.subtitle{
  text-align:center;
  color: var(--text-dim);
  font-size:14px;
  margin:0 0 26px;
}
.progress-track{
  height:6px;
  border-radius:999px;
  background: var(--surface-2);
  overflow:hidden;
  margin-bottom:26px;
}
.progress-fill{
  height:100%;
  background: linear-gradient(90deg, var(--nuha-gold-bright), var(--nuha-gold-elegant));
  border-radius:999px;
  transition: width .35s ease;
  width:20%;
}
.q-label{
  font-size:12px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color: var(--nuha-sage);
  font-weight:700;
  margin-bottom:8px;
}
.q-text{
  font-family:'Fraunces', serif;
  font-size:21px;
  font-weight:600;
  margin:0 0 22px;
  line-height:1.3;
}
.options{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-bottom:8px;
}
.opt{
  text-align:left;
  padding:16px 18px;
  border-radius:16px;
  border:2px solid var(--line);
  background: var(--surface);
  font-family:'Manrope', sans-serif;
  font-size:15px;
  font-weight:600;
  color: var(--text);
  cursor:pointer;
  transition: all .15s ease;
}
.opt:hover{ border-color: var(--nuha-gold-elegant); background: var(--surface-2); }
.opt:active{ transform: translateY(1px); }
.nav-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:18px;
}
.back-btn{
  background:none;
  border:none;
  color: var(--text-dim);
  font-family:'Manrope',sans-serif;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  padding:6px 4px;
  visibility:hidden;
}
.back-btn.show{ visibility:visible; }
.step-count{
  font-size:12px;
  color: var(--text-dim);
  font-weight:700;
}

/* Resultado */
.result{ display:none; text-align:center; }
.result.show{ display:block; }
.result-icon{
  width:64px; height:64px; border-radius:50%; margin:0 auto 16px;
  background: radial-gradient(circle at 35% 30%, #FFF8EA, var(--nuha-gold-elegant) 70%, var(--nuha-gold-deep) 100%);
  display:flex; align-items:center; justify-content:center;
  font-size:28px;
  box-shadow: 0 8px 20px rgba(169,124,47,0.35);
}
.result-label{
  font-size:12px; letter-spacing:0.1em; text-transform:uppercase;
  color: var(--nuha-sage); font-weight:700; margin-bottom:8px;
}
.result-name{
  font-family:'Fraunces', serif; font-size:27px; font-weight:600;
  margin:0 0 10px; line-height:1.2;
}
.result-desc{
  color: var(--text-dim); font-size:14px; line-height:1.55; margin:0 0 26px;
}
.whatsapp-btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  width:100%;
  padding:16px;
  border-radius:16px;
  border:none;
  background: var(--nuha-sage);
  color:#fff;
  font-family:'Manrope',sans-serif;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  text-decoration:none;
  box-shadow: 0 10px 22px rgba(110,143,114,0.35);
}
.whatsapp-btn:hover{ filter:brightness(1.05); }
.retry-btn{
  display:block; margin:16px auto 0;
  background:none; border:none;
  color: var(--text-dim); font-size:13px; font-family:'Manrope',sans-serif;
  text-decoration:underline; cursor:pointer;
}
</style>
</head>
<body>

<div class="card">

  <div id="quizView">
    <h1>¿Qué masaje <em>necesitás</em>?</h1>
    <p class="subtitle">Respondé 5 preguntas y te recomendamos el ideal para hoy</p>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

    <div class="q-label">Pregunta <span id="qNum">1</span> de 5</div>
    <div class="q-text" id="qText"></div>
    <div class="options" id="optsHolder"></div>

    <div class="nav-row">
      <button class="back-btn" id="backBtn" type="button">← Volver</button>
      <span class="step-count" id="stepCount"></span>
    </div>
  </div>

  <div class="result" id="resultView">
    <div class="result-icon">💆</div>
    <div class="result-label">Recomendado para vos</div>
    <div class="result-name" id="resultName"></div>
    <p class="result-desc" id="resultDesc"></p>
    <a class="whatsapp-btn" id="waBtn" href="#" target="_blank" rel="noopener">
      Reservar por WhatsApp
    </a>
    <button class="retry-btn" id="retryBtn" type="button">Volver a hacer el test</button>
  </div>

</div>

<script>
// ---------- CONFIGURACIÓN ----------
const BUSINESS_WHATSAPP = "5493404633551"; // mismo número que la ruleta

const QUESTIONS = [
  {
    text: "¿Qué buscás hoy?",
    options: [
      { letter: 'A', text: 'Relajarme' },
      { letter: 'B', text: 'Sacarme contracturas' },
      { letter: 'C', text: 'Sentir mis piernas más livianas' },
      { letter: 'D', text: 'Relajar todo mi cuerpo' }
    ]
  },
  {
    text: "¿Cómo te sentís?",
    options: [
      { letter: 'A', text: 'Estresado/a' },
      { letter: 'B', text: 'Tensionado/a' },
      { letter: 'C', text: 'Cansado/a de las piernas' },
      { letter: 'D', text: 'Cansado/a en general' }
    ]
  },
  {
    text: "¿Dónde sentís más molestias?",
    options: [
      { letter: 'A', text: 'En todo el cuerpo' },
      { letter: 'B', text: 'Espalda, cuello u hombros' },
      { letter: 'C', text: 'Piernas o pies' },
      { letter: 'D', text: 'En varias zonas' }
    ]
  },
  {
    text: "¿Qué necesitás después del masaje?",
    options: [
      { letter: 'A', text: 'Tranquilidad' },
      { letter: 'B', text: 'Alivio' },
      { letter: 'C', text: 'Ligereza' },
      { letter: 'D', text: 'Bienestar general' }
    ]
  },
  {
    text: "Elegí una palabra:",
    options: [
      { letter: 'A', text: 'Calma' },
      { letter: 'B', text: 'Alivio' },
      { letter: 'C', text: 'Ligereza' },
      { letter: 'D', text: 'Bienestar' }
    ]
  }
];

const RESULTS = {
  A: {
    name: 'Masaje relajante',
    desc: 'Ideal para bajar el estrés y encontrar calma. Trabajamos con maniobras suaves y envolventes para que te desconectes por completo.'
  },
  B: {
    name: 'Masaje descontracturante',
    desc: 'Pensado para aliviar tensión acumulada en espalda, cuello y hombros. Trabajo más profundo, enfocado en las zonas de mayor contractura.'
  },
  C: {
    name: 'Drenaje linfático',
    desc: 'Perfecto para piernas cansadas o pesadas. Estimula la circulación y ayuda a reducir la sensación de pesadez.'
  },
  D: {
    name: 'Masaje cuerpo completo',
    desc: 'Una experiencia integral para relajar todo el cuerpo de punta a punta, combinando técnicas de bienestar general.'
  }
};

// ---------- LÓGICA ----------
let current = 0;
let answers = []; // guarda la letra elegida en cada pregunta

const qNum = document.getElementById('qNum');
const qText = document.getElementById('qText');
const optsHolder = document.getElementById('optsHolder');
const progressFill = document.getElementById('progressFill');
const backBtn = document.getElementById('backBtn');
const stepCount = document.getElementById('stepCount');
const quizView = document.getElementById('quizView');
const resultView = document.getElementById('resultView');

function renderQuestion(){
  const q = QUESTIONS[current];
  qNum.textContent = current + 1;
  qText.textContent = q.text;
  stepCount.textContent = `${current + 1}/${QUESTIONS.length}`;
  progressFill.style.width = `${((current) / QUESTIONS.length) * 100 + 10}%`;
  backBtn.classList.toggle('show', current > 0);

  optsHolder.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'opt';
    btn.textContent = `${opt.letter}. ${opt.text}`;
    btn.addEventListener('click', () => selectAnswer(opt.letter));
    optsHolder.appendChild(btn);
  });
}

function selectAnswer(letter){
  answers[current] = letter;
  if (current < QUESTIONS.length - 1){
    current++;
    renderQuestion();
  } else {
    showResult();
  }
}

backBtn.addEventListener('click', () => {
  if (current > 0){
    current--;
    renderQuestion();
  }
});

function computeResult(){
  const counts = { A:0, B:0, C:0, D:0 };
  answers.forEach(letter => { counts[letter] = (counts[letter]||0) + 1; });

  let best = null, bestCount = -1;
  ['A','B','C','D'].forEach(letter => {
    if (counts[letter] > bestCount){
      bestCount = counts[letter];
      best = letter;
    }
  });
  // Desempate: si hay empate en el máximo, se prioriza la letra elegida
  // en la ÚLTIMA pregunta (la más reciente refleja mejor lo que siente ahora).
  const maxCount = bestCount;
  const tied = ['A','B','C','D'].filter(l => counts[l] === maxCount);
  if (tied.length > 1){
    for (let i = answers.length - 1; i >= 0; i--){
      if (tied.includes(answers[i])){ best = answers[i]; break; }
    }
  }
  return best;
}

function showResult(){
  const letter = computeResult();
  const r = RESULTS[letter];
  document.getElementById('resultName').textContent = r.name;
  document.getElementById('resultDesc').textContent = r.desc;

  const msg = encodeURIComponent(`¡Hola! Hice el test de masajes y me recomendó: ${r.name}. Quiero reservar un turno.`);
  document.getElementById('waBtn').href = `https://wa.me/${BUSINESS_WHATSAPP}?text=${msg}`;

  quizView.style.display = 'none';
  resultView.classList.add('show');
}

document.getElementById('retryBtn').addEventListener('click', () => {
  current = 0;
  answers = [];
  resultView.classList.remove('show');
  quizView.style.display = 'block';
  renderQuestion();
});

renderQuestion();
</script>
</body>
</html>
