<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Nahu · Turnos</title>
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Nahu%20Turnos%22,%22short_name%22:%22Nahu%22,%22display%22:%22standalone%22,%22start_url%22:%22.%22,%22background_color%22:%22%23EDEAE0%22,%22theme_color%22:%22%2326301F%22}" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Nahu" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #EDEAE0; font-family: 'Inter', sans-serif; color: #26301F; }
  #root { min-height: 100vh; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  .spin { animation: spin 1s linear infinite; display:inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  input[type=number]::-webkit-inner-spin-button { opacity: 1; }
  html { overflow-x: hidden; }

  /* ===== Layout responsivo (fix de recorte por los bordes) ===== */
  .app-shell { min-height: 100vh; background: #EDEAE0; display: flex; justify-content: center; padding: 24px; box-sizing: border-box; }
  .app-frame { width: 100%; max-width: 1080px; min-height: 720px; background: #F5F2E9; border-radius: 24px; border: 1px solid #E2DCC9; display: flex; overflow: hidden; }
  .app-sidebar { width: 240px; flex-shrink: 0; background: #26301F; color: #F5F2E9; padding: 28px 20px; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; }
  .app-sidebar nav { display: flex; flex-direction: column; gap: 4px; margin-top: 40px; }
  .app-main { flex: 1; min-width: 0; padding: 32px 40px; overflow-y: auto; overflow-x: hidden; box-sizing: border-box; }

  .agendar-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 40px; min-width: 0; }
  .slot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; min-width: 0; }
  .home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; min-width: 0; }
  .turnos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; min-width: 0; }
  .precios-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 8px; min-width: 0; }
  .day-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; min-width: 0; }

  @media (max-width: 860px) {
    .app-shell { padding: 12px; }
    .app-frame { flex-direction: column; min-height: auto; }
    .app-sidebar { width: 100%; flex-direction: row; align-items: center; justify-content: space-between; padding: 12px 14px; gap: 10px; }
    .app-sidebar .brand-block { display: none; }
    .app-sidebar nav { flex-direction: row; margin-top: 0; gap: 6px; overflow-x: auto; }
    .app-sidebar .nav-extra { display: none !important; }
    .app-sidebar .sync-row { display: none !important; }
    .app-main { padding: 18px; }
    .agendar-grid { grid-template-columns: 1fr; gap: 24px; }
  }
  @media (max-width: 480px) {
    .app-main { padding: 14px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

/* ======= CONFIGURÁ ACÁ TU URL DE APPS SCRIPT ======= */
const API_URL = "https://script.google.com/macros/s/AKfycbz8VOUaaBkaPMdvmuPYsAYyiRhaha7nUeH0I6kk7P671BWejcyLii0LJ7Ap37Reu6x6/exec";
/* ==================================================== */

const ESPECIALES = [
  { id: "e1", nombre: "Hora de estudio", icon: "📖" },
  { id: "e2", nombre: "Rendir (examen de carrera)", icon: "🎓" },
];
const DIAS = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];

function toISODate(d) { return d.toISOString().slice(0, 10); }
function formatDiaCorto(iso) { const d = new Date(iso + "T00:00:00"); return { dia: DIAS[d.getDay()], num: d.getDate() }; }
function formatFechaLarga(iso) { const d = new Date(iso + "T00:00:00"); return d.toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" }); }
function money(n) { return "$" + Number(n).toLocaleString("es-AR"); }
function buildSlots() {
  const slots = [];
  for (let h = 9; h <= 20; h++) for (const m of [0, 30]) { if (h === 20 && m === 30) continue; slots.push(`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`); }
  return slots;
}
const SLOTS = buildSlots();
function buildNextDays(n) {
  const out = []; const today = new Date(); today.setHours(0,0,0,0);
  for (let i = 0; i < n; i++) { const d = new Date(today); d.setDate(today.getDate() + i); out.push(toISODate(d)); }
  return out;
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
async function withRetry(fn, retries = 3, delayMs = 700) {
  let lastErr;
  for (let i = 0; i <= retries; i++) {
    try { return await fn(); }
    catch (e) { lastErr = e; if (i < retries) await sleep(delayMs * (i + 1)); }
  }
  throw lastErr;
}
async function apiGet() {
  return withRetry(async () => {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error("read fail");
    return res.json();
  });
}
async function apiPost(body) {
  // Sin reintento automático acá: un POST no es seguro de repetir a ciegas
  // (podría duplicar el dato si el primer intento en realidad sí se guardó).
  const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(body) });
  if (!res.ok) throw new Error("write fail");
  return res.json();
}

function App() {
  const [view, setView] = useState("home");
  const [precios, setPrecios] = useState([]);
  const [turnos, setTurnos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [syncing, setSyncing] = useState(false);
  const [syncLabel, setSyncLabel] = useState("Guardando…");

  const cargarDatos = useCallback(async (opts) => {
    const silent = opts && opts.silent;
    if (!silent) setError(null);
    try {
      const data = await apiGet();
      setPrecios(data.precios || []);
      setTurnos(data.turnos || []);
      return data;
    } catch (e) {
      if (!silent) setError("No se pudo conectar con la hoja de cálculo. Revisá la conexión e intentá de nuevo.");
      throw e;
    } finally { setLoading(false); }
  }, []);

  useEffect(() => { cargarDatos().catch(() => {}); }, [cargarDatos]);

  // Guarda un cambio. Si el POST falla, en vez de reintentarlo a ciegas (lo que
  // puede duplicar el dato), primero relee la hoja y se fija si el cambio ya
  // está aplicado (verify). Solo si realmente no se aplicó, reintenta el envío.
  async function runAction(action, payload, verify) {
    setSyncing(true);
    setError(null);
    const maxAttempts = 3;
    try {
      for (let attempt = 1; attempt <= maxAttempts; attempt++) {
        try {
          setSyncLabel("Guardando…");
          await apiPost({ action, ...payload });
          await cargarDatos({ silent: true });
          return; // éxito directo
        } catch (e) {
          setSyncLabel("Verificando…");
          try {
            const data = await cargarDatos({ silent: true });
            if (verify && verify(data)) return; // en realidad sí se había guardado
          } catch (e2) { /* ni siquiera pudimos releer; seguimos al reintento */ }
          if (attempt === maxAttempts) {
            setError("No se pudo guardar el cambio. Probá de nuevo.");
          } else {
            setSyncLabel("Reintentando…");
            await sleep(700 * attempt);
          }
        }
      }
    } finally {
      setSyncing(false);
      setSyncLabel("Guardando…");
    }
  }

  return (
    <Shell view={view} onNavigate={setView} syncing={syncing} syncLabel={syncLabel} onRefresh={() => cargarDatos().catch(() => {})}>
      {loading ? (
        <CenterState><span className="spin">⏳</span><p>Cargando datos de la hoja de cálculo…</p></CenterState>
      ) : error ? (
        <CenterState>
          <p style={{ color: "#9C4A3D" }}>{error}</p>
          <button style={styles.retryBtn} onClick={() => cargarDatos().catch(() => {})}>↻ Reintentar</button>
        </CenterState>
      ) : (
        <>
          {view === "home" && <Home onNavigate={setView} />}
          {view === "agendar" && (
            <Agendar precios={precios} turnos={turnos}
              onConfirm={(nuevo) => runAction(
                "addTurno", { turno: nuevo },
                (data) => (data.turnos || []).some(t => t.id === nuevo.id)
              ).then(() => setView("turnos"))} />
          )}
          {view === "turnos" && (
            <Turnos precios={precios} turnos={turnos}
              onCancelar={(id) => runAction(
                "cancelarTurno", { id },
                (data) => (data.turnos || []).some(t => t.id === id && t.estado === "cancelado")
              )}
              onFinalizar={(id, propina) => runAction(
                "finalizarTurno", { id, propina },
                (data) => (data.turnos || []).some(t => t.id === id && t.estado === "finalizado")
              )} />
          )}
          {view === "precios" && (
            <Precios precios={precios} onGuardar={(draft) => runAction(
              "updatePrecios", { precios: draft },
              (data) => JSON.stringify(data.precios) === JSON.stringify(draft)
            )} />
          )}
        </>
      )}
    </Shell>
  );
}

function CenterState({ children }) { return <div style={styles.centerState}>{children}</div>; }

function Shell({ children, view, onNavigate, syncing, syncLabel, onRefresh }) {
  const NAV = [
    { key: "agendar", icon: "📅", label: "Agendar turno" },
    { key: "turnos", icon: "📋", label: "Turnos" },
    { key: "precios", icon: "💰", label: "Modificar precios" },
  ];
  return (
    <div className="app-shell">
      <div className="app-frame">
        <aside className="app-sidebar">
          <div className="brand-block">
            <p style={styles.brandEyebrow}>Estudio</p>
            <h1 style={styles.brandTitle}>Nahu</h1>
          </div>
          <nav>
            {NAV.map(({ key, icon, label }) => (
              <button key={key} onClick={() => onNavigate(key)}
                style={{ ...styles.navItem, ...(view === key ? styles.navItemActive : {}) }}>
                <span>{icon}</span>{label}
              </button>
            ))}
            <div className="nav-extra" style={{ ...styles.navItem, opacity: 0.45, cursor: "default" }}><span>📊</span>Reporte de redes</div>
          </nav>
          <button onClick={onRefresh} className="sync-row" style={styles.syncRow}>
            <span className={syncing ? "spin" : ""}>↻</span>{syncing ? syncLabel : "Sincronizado con la hoja"}
          </button>
        </aside>
        <main className="app-main">
          {view !== "home" && <p style={styles.backLink} onClick={() => onNavigate("home")}>‹ Inicio</p>}
          <div>{children}</div>
        </main>
      </div>
    </div>
  );
}

function Home({ onNavigate }) {
  const items = [
    { key: "agendar", icon: "📅", title: "Agendar turno", desc: "Elegí día, hora y tipo de masaje" },
    { key: "turnos", icon: "📋", title: "Turnos", desc: "Pendientes, finalizados y cancelados" },
    { key: "precios", icon: "💰", title: "Modificar precios", desc: "Actualizá el precio de cada masaje" },
  ];
  return (
    <div>
      <p style={styles.eyebrow}>Hoy es</p>
      <h1 style={styles.homeTitle}>{formatFechaLarga(toISODate(new Date()))}</h1>
      <div className="home-grid">
        {items.map(({ key, icon, title, desc }) => (
          <button key={key} style={styles.homeCard} onClick={() => onNavigate(key)}>
            <span style={{ fontSize: 22 }}>{icon}</span>
            <div style={styles.homeCardTitle}>{title}</div>
            <div style={styles.homeCardDesc}>{desc}</div>
          </button>
        ))}
        <div style={{ ...styles.homeCard, opacity: 0.5, cursor: "default" }}>
          <span style={{ fontSize: 22 }}>📊</span>
          <div style={styles.homeCardTitle}>Reporte de redes</div>
          <div style={styles.homeCardDesc}>Próximamente — panel de Power BI</div>
        </div>
      </div>
    </div>
  );
}

function Agendar({ precios, turnos, onConfirm }) {
  const dias = useMemo(() => buildNextDays(21), []);
  const [fecha, setFecha] = useState(dias[0]);
  const [hora, setHora] = useState(null);
  const [tipoId, setTipoId] = useState(null);
  const [enviando, setEnviando] = useState(false);

  const ocupadas = useMemo(() => new Set(turnos.filter(t => t.fecha === fecha && t.estado === "pendiente").map(t => t.hora)), [turnos, fecha]);
  const opciones = [...precios.map(p => ({ ...p, especial: false })), ...ESPECIALES.map(e => ({ ...e, especial: true }))];
  const seleccion = opciones.find(o => o.id === tipoId);
  const puedeConfirmar = fecha && hora && tipoId && !enviando;

  async function confirmar() {
    setEnviando(true);
    await onConfirm({ id: `t_${Date.now()}`, fecha, hora, tipoNombre: seleccion.nombre, precio: seleccion.especial ? null : seleccion.precio, especial: !!seleccion.especial });
    setEnviando(false); setHora(null); setTipoId(null);
  }

  return (
    <div>
      <h2 style={styles.screenTitle}>Agendar turno</h2>
      <div className="agendar-grid">
        <div style={{ minWidth: 0 }}>
          <p style={styles.sectionLabel}>Día</p>
          <div className="day-scroll">
            {dias.map(d => {
              const { dia, num } = formatDiaCorto(d); const active = d === fecha;
              return (
                <button key={d} onClick={() => { setFecha(d); setHora(null); }}
                  style={{ ...styles.dayPill, ...(active ? styles.dayPillActive : {}) }}>
                  <span style={{ fontSize: 11, opacity: 0.75 }}>{dia}</span>
                  <span style={{ fontSize: 17, fontWeight: 600 }}>{num}</span>
                </button>
              );
            })}
          </div>
          <p style={{ ...styles.sectionLabel, marginTop: 22 }}>Hora</p>
          <div className="slot-grid">
            {SLOTS.map(s => {
              const ocupado = ocupadas.has(s); const active = s === hora;
              return (
                <button key={s} disabled={ocupado} onClick={() => setHora(s)}
                  style={{ ...styles.slot, ...(active ? styles.slotActive : {}), ...(ocupado ? styles.slotDisabled : {}) }}>
                  {s}
                </button>
              );
            })}
          </div>
        </div>
        <div style={{ minWidth: 0 }}>
          <p style={styles.sectionLabel}>Tipo</p>
          <div style={styles.tipoList}>
            {precios.map(p => (
              <button key={p.id} onClick={() => setTipoId(p.id)} style={{ ...styles.tipoRow, ...(tipoId === p.id ? styles.tipoRowActive : {}) }}>
                <span>{p.nombre}</span><span style={{ color: "#8A6738", fontWeight: 600 }}>{money(p.precio)}</span>
              </button>
            ))}
            {ESPECIALES.map(e => (
              <button key={e.id} onClick={() => setTipoId(e.id)} style={{ ...styles.tipoRow, ...(tipoId === e.id ? styles.tipoRowActive : {}) }}>
                <span style={{ display: "flex", alignItems: "center", gap: 8 }}>{e.icon} {e.nombre}</span>
              </button>
            ))}
          </div>
          <button disabled={!puedeConfirmar} onClick={confirmar} style={{ ...styles.primaryBtn, opacity: puedeConfirmar ? 1 : 0.4, marginTop: 18 }}>
            {enviando ? "Guardando…" : "Confirmar turno"}
          </button>
          <p style={styles.helperNote}>El turno se guarda directo en tu hoja de cálculo "nahu negocio".</p>
        </div>
      </div>
    </div>
  );
}

function Turnos({ precios, turnos, onCancelar, onFinalizar }) {
  const [tab, setTab] = useState("pendiente");
  const [finalizando, setFinalizando] = useState(null);
  const [propinaInput, setPropinaInput] = useState("");
  const [huboPropina, setHuboPropina] = useState(null);
  const [procesando, setProcesando] = useState(null); // { id, accion: 'cancelar' | 'finalizar' }

  const filtrados = turnos.filter(t => t.estado === tab).sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));

  function abrirFinalizar(id) { setFinalizando(id); setHuboPropina(null); setPropinaInput(""); }

  function cancelar(id) {
    setProcesando({ id, accion: "cancelar" });
    Promise.resolve(onCancelar(id)).finally(() => setProcesando(null));
  }

  function confirmarFinalizar(id) {
    const propina = huboPropina ? Number(propinaInput || 0) : 0;
    setFinalizando(null);
    setProcesando({ id, accion: "finalizar" });
    Promise.resolve(onFinalizar(id, propina)).finally(() => setProcesando(null));
  }

  return (
    <div>
      <h2 style={styles.screenTitle}>Turnos</h2>
      <div style={styles.tabs}>
        {[["pendiente","Pendientes"],["finalizado","Finalizados"],["cancelado","Cancelados"]].map(([key,label]) => (
          <button key={key} onClick={() => setTab(key)} style={{ ...styles.tab, ...(tab === key ? styles.tabActive : {}) }}>{label}</button>
        ))}
      </div>
      <div className="turnos-grid">
        {filtrados.length === 0 && (
          <p style={{ ...styles.helperNote, gridColumn: "1 / -1", textAlign: "center", marginTop: 24 }}>
            No hay turnos {tab === "pendiente" ? "pendientes" : tab === "finalizado" ? "finalizados" : "cancelados"}.
          </p>
        )}
        {filtrados.map(t => {
          const enFinalizacion = finalizando === t.id;
          const enProceso = procesando && procesando.id === t.id;
          return (
            <div key={t.id} style={styles.turnoCard}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                <span style={styles.turnoTipo}>{t.tipoNombre}</span>
                {t.precio != null && <span style={styles.turnoPrecio}>{money(t.precio)}</span>}
              </div>
              <div style={styles.turnoMeta}>
                {formatFechaLarga(t.fecha)} · {t.hora}
                {t.estado === "finalizado" && t.propina > 0 && <span> · propina {money(t.propina)}</span>}
                {t.estado === "finalizado" && !t.propina && <span> · sin propina</span>}
              </div>
              {tab === "pendiente" && !enFinalizacion && !enProceso && (
                <div style={styles.turnoActions}>
                  <button style={styles.cancelBtn} onClick={() => cancelar(t.id)}>✕ Cancelar</button>
                  <button style={styles.finishBtn} onClick={() => abrirFinalizar(t.id)}>✓ Finalizar</button>
                </div>
              )}
              {enFinalizacion && !enProceso && (
                <div style={styles.finalizePanel}>
                  <p style={styles.sectionLabel}>¿Dejó propina?</p>
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={() => setHuboPropina(true)} style={{ ...styles.smallToggle, ...(huboPropina === true ? styles.smallToggleActive : {}) }}>Sí</button>
                    <button onClick={() => setHuboPropina(false)} style={{ ...styles.smallToggle, ...(huboPropina === false ? styles.smallToggleActive : {}) }}>No</button>
                  </div>
                  {huboPropina && (
                    <input type="number" inputMode="numeric" placeholder="Monto de la propina" value={propinaInput}
                      onChange={(e) => setPropinaInput(e.target.value)} style={styles.input} />
                  )}
                  <button disabled={huboPropina === null} onClick={() => confirmarFinalizar(t.id)}
                    style={{ ...styles.primaryBtn, marginTop: 10, opacity: huboPropina === null ? 0.4 : 1 }}>Guardar</button>
                </div>
              )}
              {enProceso && (
                <div style={styles.turnoActions}>
                  <span style={styles.turnoProcesando}>
                    <span className="spin">⏳</span>
                    {procesando.accion === "finalizar" ? "Cerrando turno…" : "Cancelando…"}
                  </span>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Precios({ precios, onGuardar }) {
  const [draft, setDraft] = useState(precios);
  useEffect(() => setDraft(precios), [precios]);
  const cambiado = JSON.stringify(draft) !== JSON.stringify(precios);
  function setPrecio(id, valor) { setDraft(draft.map(p => p.id === id ? { ...p, precio: valor === "" ? "" : Number(valor) } : p)); }
  return (
    <div>
      <h2 style={styles.screenTitle}>Modificar precios</h2>
      <div className="precios-grid">
        {draft.map(p => (
          <div key={p.id} style={styles.precioRow}>
            <span style={styles.precioNombre}>{p.nombre}</span>
            <div style={styles.precioInputWrap}>
              <span style={{ color: "#8A8072" }}>$</span>
              <input type="number" inputMode="numeric" value={p.precio} onChange={(e) => setPrecio(p.id, e.target.value)} style={styles.precioInput} />
            </div>
          </div>
        ))}
      </div>
      <p style={styles.helperNote}>Cada turno nuevo o pendiente toma el precio actual de esta lista — no hace falta tocar nada más.</p>
      <button disabled={!cambiado} onClick={() => onGuardar(draft)} style={{ ...styles.primaryBtn, opacity: cambiado ? 1 : 0.4, maxWidth: 260, marginTop: 8 }}>Guardar precios</button>
    </div>
  );
}

const styles = {
  brandEyebrow: { margin: 0, fontSize: 12, color: "#B7C4A8" },
  brandTitle: { fontFamily: "'Fraunces', serif", fontSize: 26, margin: "2px 0 0", fontWeight: 500 },
  navItem: { display: "flex", alignItems: "center", gap: 10, padding: "11px 12px", borderRadius: 10, border: "none", background: "none", color: "#DAD6C8", fontSize: 14, textAlign: "left", cursor: "pointer", fontFamily: "inherit", whiteSpace: "nowrap" },
  navItemActive: { background: "#3B4A32", color: "#F5F2E9" },
  syncRow: { display: "flex", alignItems: "center", gap: 8, fontSize: 11.5, color: "#9DAE8C", background: "none", border: "none", cursor: "pointer", fontFamily: "inherit", padding: 0 },
